name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, "release/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Unit tests
        run: ./gradlew.bat --no-daemon :app:testDebugUnitTest
      - name: Lint and debug APK
        run: ./gradlew.bat --no-daemon :app:lintDebug :app:assembleDebug
      - name: Minified release build (unsigned here) to catch R8 problems
        run: ./gradlew.bat --no-daemon :app:assembleRelease
      - name: Guard against empty source files
        shell: bash
        run: |
          empty=$(git ls-files 'app/src/*' 'scripts/*' 'docs/releases/*' | while read -r f; do [ -s "$f" ] || echo "$f"; done)
          if [ -n "$empty" ]; then echo "empty files:"; echo "$empty"; exit 1; fi
      - name: Guard against placeholder Quran text and leaked keys
        shell: bash
        run: |
          if grep -rn "آية رقم" app/src/main; then echo "placeholder Quran text found"; exit 1; fi
          if git grep -nE "lin_api_[A-Za-z0-9]{20,}"; then echo "leaked key found"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
