name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, "release/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Unit tests
        run: ./gradlew.bat --no-daemon :app:testDebugUnitTest
      - name: Lint and debug APK
        run: ./gradlew.bat --no-daemon :app:lintDebug :app:assembleDebug
      - name: Guard against placeholder Quran text and leaked keys
        shell: bash
        run: |
          ! grep -rn "آية رقم" app/src/main
          ! git grep -nE "lin_api_[A-Za-z0-9]{20,}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
